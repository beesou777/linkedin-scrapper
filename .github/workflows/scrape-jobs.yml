name: Scrape LinkedIn Jobs

on:
  schedule:
    # Revisit the rolling evry 4 hours window every four hours to fill gaps.
    - cron: '5 */4 * * *'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: linkedin-job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Allow up to 60 minutes for scraping (scraping 1000+ jobs takes time)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        timeout-minutes: 55 # Slightly less than job timeout
        run: npx ts-node scrape-nepal-jobs.ts

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nepal-jobs-json
          path: nepal-jobs.json
          retention-days: 30

