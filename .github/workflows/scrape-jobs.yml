name: Scrape LinkedIn Jobs

on:
  schedule:
    # Run daily at 6 AM UTC (11:45 AM Nepal time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Allow up to 60 minutes for scraping (scraping 1000+ jobs takes time)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          # Install Chromium dependencies for Ubuntu 24.04
          # Use package names that work with Ubuntu 24.04 (Noble)
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2t64 \
            libdbus-1-3t64 \
            libexpat1t64 \
            libfontconfig1t64 \
            libgbm1 \
            libgcc-s1 \
            libglib2.0-0t64 \
            libgtk-3-0t64 \
            libnspr4t64 \
            libnss3t64 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6t64 \
            libx11-xcb1t64 \
            libxcb1t64 \
            libxcomposite1t64 \
            libxcursor1t64 \
            libxdamage1t64 \
            libxext6t64 \
            libxfixes3t64 \
            libxi6t64 \
            libxrandr2t64 \
            libxrender1t64 \
            libxss1t64 \
            libxtst6t64 \
            lsb-release \
            wget \
            xdg-utils

      - name: Run scraper
        env:
          LI_AT_COOKIE: ${{ secrets.LI_AT_COOKIE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        timeout-minutes: 55 # Slightly less than job timeout
        run: npx ts-node scrape-nepal-jobs.ts

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nepal-jobs-json
          path: nepal-jobs.json
          retention-days: 30

